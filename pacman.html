<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #05050b;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.game-wrap {
  width: min(92vw, 760px);
  text-align: center;
}

h1 {
  color: #ffd900;
  margin: 0 0 8px;
  font-size: clamp(28px, 5vw, 46px);
  letter-spacing: 3px;
}

.hud {
  display: flex;
  justify-content: space-between;
  margin: 0 auto 10px;
  width: min(92vw, 620px);
  font-weight: bold;
}

canvas {
  display: block;
  margin: auto;
  background: #000;
  border: 3px solid #1515ff;
  box-shadow: 0 0 22px #1111aa;
  max-width: 100%;
  height: auto;
}

.help {
  margin-top: 10px;
  color: #bbb;
  font-size: 14px;
}

button {
  margin-top: 10px;
  padding: 9px 18px;
  border: 0;
  border-radius: 8px;
  background: #ffd900;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #fff000;
}
</style>
</head>

<body>

<div class="game-wrap">

<h1>PAC-MAN</h1>

<div class="hud">
  <span>PUNTOS: <b id="score">0</b></span>
  <span>VIDAS: <b id="lives">3</b></span>
</div>

<canvas id="game" width="620" height="700"></canvas>

<div class="help">
  Flechas o WASD para moverte · Come los puntos y evita a los fantasmas 👻
</div>

<button onclick="resetGame()">Reiniciar</button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");

const TILE = 20;
const COLS = 31;
const ROWS = 35;

const map = [
"###############################",
"#............##..............#",
"#.####.#####.##.#####.####.#.#",
"#o####.#####.##.#####.####.o.#",
"#.####.#####.##.#####.####.#.#",
"#.............................#",
"#.####.##.###########.##.####.#",
"#......##.....##......##......#",
"######.#####.##.#####.######.#",
"######.#####.##.#####.######.#",
"#............##..............#",
"#.####.#####.##.#####.####.#.#",
"#.####.#####.##.#####.####.#.#",
"#o..##................##...o.#",
"###.##.##.###########.##.##.###",
"    .   ##     G     ##   .    ",
"###.##.##.###########.##.##.###",
"#o..##................##...o.#",
"#.####.#####.##.#####.####.#.#",
"#.####.#####.##.#####.####.#.#",
"#............##..............#",
"######.#####.##.#####.######.#",
"######.##.............##......#",
"#.####.##.###########.##.####.#",
"#......##.....##......##......#",
"#.##########.##.###########..#",
"#.............................#",
"#.####.#####.##.#####.####.#.#",
"#.####.#####.##.#####.####.#.#",
"#o..........................o#",
"#.####.##.###########.##.####.#",
"#......##.............##......#",
"#.##########.##.###########..#",
"#.............................#",
"###############################"
];

const W = COLS * TILE;
const H = ROWS * TILE;

canvas.width = W;
canvas.height = H;

let grid;
let player;
let ghosts;
let score;
let lives;
let running;
let won;
let lastTime = 0;
let mouth = 0;


function build() {

  grid = map.map(row =>
    row.padEnd(COLS, "#").slice(0, COLS).split("")
  );

  score = 0;
  lives = 3;
  running = true;
  won = false;

  player = {
    x: 15,
    y: 26,
    dir: {x: 0, y: 0},
    next: {x: 0, y: 0}
  };

  ghosts = [

    {
      x: 14,
      y: 16,
      color: "#ff3b3b",
      dir: {x: 1, y: 0}
    },

    {
      x: 15,
      y: 16,
      color: "#ff8de1",
      dir: {x: -1, y: 0}
    },

    {
      x: 16,
      y: 16,
      color: "#32ffff",
      dir: {x: 0, y: -1}
    },

    {
      x: 17,
      y: 16,
      color: "#ff9f2d",
      dir: {x: 0, y: 1}
    }

  ];

  scoreEl.textContent = score;
  livesEl.textContent = lives;
}


function resetGame() {

  build();

  lastTime = performance.now();

  requestAnimationFrame(loop);
}


function wall(x, y) {

  if (y < 0 || y >= ROWS)
    return true;

  x = (x + COLS) % COLS;

  return grid[y][x] === "#";
}


function valid(x, y) {

  return !wall(x, y);

}


function canMove(object, direction) {

  return valid(
    Math.round(object.x) + direction.x,
    Math.round(object.y) + direction.y
  );

}


function key(e) {

  const k = e.key.toLowerCase();

  const dirs = {

    arrowleft: {x:-1,y:0},
    a: {x:-1,y:0},

    arrowright: {x:1,y:0},
    d: {x:1,y:0},

    arrowup: {x:0,y:-1},
    w: {x:0,y:-1},

    arrowdown: {x:0,y:1},
    s: {x:0,y:1}

  };

  if (dirs[k]) {

    player.next = dirs[k];

    e.preventDefault();

  }

}


addEventListener("keydown", key);


function movePlayer() {

  if (canMove(player, player.next))
    player.dir = player.next;

  if (canMove(player, player.dir)) {

    player.x += player.dir.x * 0.12;
    player.y += player.dir.y * 0.12;

  }

  if (player.x < 0)
    player.x = COLS - 1;

  if (player.x >= COLS)
    player.x = 0;

  const tx = Math.round(player.x);
  const ty = Math.round(player.y);

  if (
    Math.abs(player.x - tx) < 0.08 &&
    Math.abs(player.y - ty) < 0.08
  ) {

    player.x = tx;
    player.y = ty;

    if (grid[ty] && grid[ty][tx] === ".") {

      grid[ty][tx] = " ";

      score += 10;

    }

    if (grid[ty] && grid[ty][tx] === "o") {

      grid[ty][tx] = " ";

      score += 50;

    }

    scoreEl.textContent = score;

    if (
      !grid.some(row =>
        row.includes(".") || row.includes("o")
      )
    ) {

      won = true;
      running = false;

    }

  }

}


function moveGhost(g) {

  if (
    Math.abs(g.x - Math.round(g.x)) < 0.05 &&
    Math.abs(g.y - Math.round(g.y)) < 0.05
  ) {

    g.x = Math.round(g.x);
    g.y = Math.round(g.y);

    let options = [

      {x:1,y:0},
      {x:-1,y:0},
      {x:0,y:1},
      {x:0,y:-1}

    ].filter(direction =>
      canMove(g, direction)
    );

    const reverse = {
      x: -g.dir.x,
      y: -g.dir.y
    };

    let choices = options.filter(direction =>
      !(
        direction.x === reverse.x &&
        direction.y === reverse.y
      )
    );

    if (!choices.length)
      choices = options;

    if (Math.random() < 0.75) {

      choices.sort((a,b) => {

        const da = Math.hypot(
          g.x + a.x - player.x,
          g.y + a.y - player.y
        );

        const db = Math.hypot(
          g.x + b.x - player.x,
          g.y + b.y - player.y
        );

        return da - db;

      });

      g.dir = choices[0] || g.dir;

    } else {

      g.dir =
        choices[Math.floor(Math.random() * choices.length)]
        || g.dir;

    }

  }

  if (canMove(g, g.dir)) {

    g.x += g.dir.x * 0.07;
    g.y += g.dir.y * 0.07;

  } else {

    g.dir = {x:0,y:0};

  }

}


function collision() {

  for (const g of ghosts) {

    if (
      Math.hypot(
        g.x - player.x,
        g.y - player.y
      ) < 0.55
    ) {

      lives--;

      livesEl.textContent = lives;

      if (lives <= 0) {

        running = false;
        won = false;

        return;

      }

      player.x = 15;
      player.y = 26;

      player.dir = {x:0,y:0};
      player.next = {x:0,y:0};

      ghosts.forEach((ghost, i) => {

        ghost.x = 14 + i;
        ghost.y = 16;

        ghost.dir = {
          x: i % 2 ? 1 : -1,
          y: 0
        };

      });

      break;

    }

  }

}


function drawMaze() {

  for (let y = 0; y < ROWS; y++) {

    for (let x = 0; x < COLS; x++) {

      const cell = grid[y][x];

      if (cell === "#") {

        ctx.fillStyle = "#0909b8";

        ctx.fillRect(
          x * TILE,
          y * TILE,
          TILE,
          TILE
        );

        ctx.fillStyle = "#000";

        ctx.fillRect(
          x * TILE + 3,
          y * TILE + 3,
          TILE - 6,
          TILE - 6
        );

      }

      else if (
        cell === "." ||
        cell === "o"
      ) {

        ctx.fillStyle = "#ffe6a3";

        ctx.beginPath();

        ctx.arc(
          x * TILE + 10,
          y * TILE + 10,
          cell === "o" ? 5 : 2,
          0,
          Math.PI * 2
        );

        ctx.fill();

      }

    }

  }

}


function drawPlayer() {

  const px = player.x * TILE + 10;
  const py = player.y * TILE + 10;

  let angle = 0;

  if (player.dir.x < 0)
    angle = Math.PI;

  if (player.dir.y < 0)
    angle = -Math.PI / 2;

  if (player.dir.y > 0)
    angle = Math.PI / 2;

  const mouthAnimation =
    (Math.sin(mouth) + 1) * 0.18;

  ctx.fillStyle = "#ffd900";

  ctx.beginPath();

  ctx.moveTo(px, py);

  ctx.arc(
    px,
    py,
    9,
    angle + mouthAnimation,
    angle + Math.PI * 2 - mouthAnimation
  );

  ctx.closePath();

  ctx.fill();

}


function drawGhost(g) {

  const x = g.x * TILE + 10;
  const y = g.y * TILE + 10;

  ctx.fillStyle = g.color;

  ctx.beginPath();

  ctx.arc(
    x,
    y - 1,
    9,
    Math.PI,
    0
  );

  ctx.lineTo(x + 9, y + 9);
  ctx.lineTo(x + 5, y + 6);
  ctx.lineTo(x + 1, y + 9);
  ctx.lineTo(x - 3, y + 6);
  ctx.lineTo(x - 7, y + 9);
  ctx.lineTo(x - 9, y + 9);

  ctx.closePath();

  ctx.fill();

  ctx.fillStyle = "white";

  ctx.beginPath();

  ctx.arc(x - 3, y - 2, 3, 0, Math.PI * 2);
  ctx.arc(x + 3, y - 2, 3, 0, Math.PI * 2);

  ctx.fill();

  ctx.fillStyle = "#222";

  ctx.beginPath();

  ctx.arc(x - 2, y - 2, 1.5, 0, Math.PI * 2);
  ctx.arc(x + 4, y - 2, 1.5, 0, Math.PI * 2);

  ctx.fill();

}


function overlay(title, subtitle) {

  ctx.fillStyle = "rgba(0,0,0,.72)";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  ctx.textAlign = "center";

  ctx.fillStyle = "#ffd900";

  ctx.font = "bold 44px Arial";

  ctx.fillText(
    title,
    W / 2,
    H / 2 - 15
  );

  ctx.fillStyle = "white";

  ctx.font = "18px Arial";

  ctx.fillText(
    subtitle,
    W / 2,
    H / 2 + 25
  );

}


function draw() {

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawMaze();

  drawPlayer();

  ghosts.forEach(drawGhost);

  if (!running) {

    overlay(
      won ? "¡GANASTE!" : "GAME OVER",
      won
        ? "¡Te comiste todos los puntos!"
        : "Presiona Reiniciar para volver a jugar"
    );

  }

}


function loop(time) {

  const dt =
    Math.min(40, time - lastTime);

  lastTime = time;

  if (running) {

    mouth += dt * 0.015;

    movePlayer();

    fantasmas.forEach(moverFantasma);

    collision();

  }

  draw();

  requestAnimationFrame(loop);

}


build();

requestAnimationFrame(loop);

</script>

</body>
</html>
